<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuantumTrust Simulator</title>
    <style>
        :root {
            --primary-bg: #1a1a2e;
            --secondary-bg: #16213e;
            --card-bg: #0f3460;
            --primary-accent: #e94560;
            --secondary-accent: #533483;
            --text-primary: #ffffff;
            --text-secondary: #a8a8b3;
            --font-main: 'Space Grotesk', sans-serif;
            --font-mono: 'Roboto Mono', monospace;
            --border-radius: 8px;
            --box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }
        @import url('https://fonts.googleapis.com/css2?family=Roboto+Mono:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap');
        body {
            margin: 0;
            font-family: var(--font-main);
            background-color: var(--primary-bg);
            color: var(--text-primary);
            line-height: 1.6;
        }
        #root { display: flex; flex-direction: column; min-height: 100vh; }
        .App { display: flex; flex-direction: column; flex-grow: 1; text-align: center; }
        .header { background-color: var(--secondary-bg); padding: 1.5rem 2rem; border-bottom: 2px solid var(--primary-accent); box-shadow: var(--box-shadow); }
        .header h1 { margin: 0; font-size: 2.5rem; letter-spacing: 2px; color: var(--primary-accent); font-weight: 700; }
        .main-content { flex-grow: 1; padding: 2rem 1rem; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2rem; }
        .footer { padding: 1rem; background-color: var(--secondary-bg); color: var(--text-secondary); font-size: 0.9rem; border-top: 1px solid var(--card-bg); }
        .card { background-color: var(--card-bg); padding: 2rem; border-radius: var(--border-radius); box-shadow: var(--box-shadow); width: 100%; max-width: 600px; border: 1px solid var(--secondary-accent); }
        .card h2 { margin-top: 0; color: var(--text-primary); font-size: 1.8rem; margin-bottom: 1.5rem; border-bottom: 2px solid var(--primary-accent); padding-bottom: 0.5rem; }
        .button { background: linear-gradient(90deg, var(--primary-accent) 0%, var(--secondary-accent) 100%); color: var(--text-primary); border: none; padding: 0.8rem 1.5rem; border-radius: var(--border-radius); font-size: 1.1rem; font-family: var(--font-main); cursor: pointer; transition: transform 0.2s ease, box-shadow 0.2s ease; font-weight: 700; margin-top: 1rem; }
        .button:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(233, 69, 96, 0.4); }
        .button:disabled { opacity: 0.5; cursor: not-allowed; }
        .input-group { margin-bottom: 1.5rem; }
        .input-group label { display: block; margin-bottom: 0.5rem; font-weight: 500; color: var(--text-secondary); }
        .input { width: 80%; padding: 0.7rem; border-radius: var(--border-radius); border: 1px solid var(--secondary-accent); background-color: var(--secondary-bg); color: var(--text-primary); font-size: 1rem; font-family: var(--font-mono); }
        .result-box { background-color: var(--secondary-bg); padding: 1rem; margin-top: 1.5rem; border-radius: var(--border-radius); border: 1px solid var(--secondary-accent); word-wrap: break-word; text-align: left; }
        .result-box p { margin: 0.5rem 0; }
        .result-box strong { color: var(--primary-accent); }
        .result-box code { font-family: var(--font-mono); font-size: 1.1rem; color: var(--text-primary); }
        .message { margin-top: 1rem; padding: 0.8rem; border-radius: var(--border-radius); }
        .message.success { background-color: rgba(23, 182, 126, 0.2); color: #17b67e; }
        .message.error { background-color: rgba(233, 69, 96, 0.2); color: var(--primary-accent); }
        .spinner { border: 4px solid rgba(255, 255, 255, 0.2); border-left-color: var(--primary-accent); border-radius: 50%; width: 24px; height: 24px; animation: spin 1s linear infinite; display: inline-block; margin-left: 10px; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body>
    <div id="root">
        <div class="App">
            <header class="header">
                <h1>QuantumTrust Simulator</h1>
                <p style="margin: 0; color: var(--text-secondary);">A Verifiable Source of Quantum Randomness (Simulated)</p>
            </header>
            <main class="main-content">
                <p>Connected Account: <code id="account-address">0xAb5801a7D398351b8bE11C439e05C5B3259aeC9B</code></p>
                <div class="card">
                    <h2>1. Generate Quantum Random Number</h2>
                    <form id="generate-form">
                        <div class="input-group">
                            <label for="bits">Number of Bits (1-64):</label>
                            <input type="number" id="bits" class="input" value="8" min="1" max="64">
                        </div>
                        <button class="button" type="submit" id="generate-button">
                            <span id="generate-button-text">Generate & Store</span>
                            <span id="generate-spinner" class="spinner" style="display: none;"></span>
                        </button>
                    </form>
                </div>
                <div class="card">
                    <h2>2. Verify Stored Number</h2>
                    <form id="verify-form">
                        <div class="input-group">
                            <label for="verifyId">Number ID:</label>
                            <input type="number" id="verifyId" class="input" placeholder="Enter ID to verify">
                        </div>
                        <button class="button" type="submit" id="verify-button">Verify on "Blockchain"</button>
                    </form>
                </div>
                <div id="message-box" class="message" style="display: none;"></div>
                <div id="generation-result-box" class="card result-box" style="display: none;"></div>
                <div id="verification-result-box" class="card result-box" style="display: none;"></div>
            </main>
            <footer class="footer">
                <p>QuantumTrust Simulator &copy; 2025 - A Hackathon Project</p>
            </footer>
        </div>
    </div>

    <script>
        // --- QUANTUM SIMULATOR (JAVASCRIPT) ---
        class QuantumSimulator {
            generateRandomBitstring(num_bits) {
                let bitstring = '';
                for (let i = 0; i < num_bits; i++) {
                    // Simulate superposition and measurement
                    // Math.random() gives a float between 0 and 1.
                    // If it's < 0.5, we say it collapsed to 0.
                    // If it's >= 0.5, we say it collapsed to 1.
                    const bit = Math.random() < 0.5 ? '0' : '1';
                    bitstring += bit;
                }
                return bitstring;
            }
        }

        // --- BLOCKCHAIN SIMULATOR (JAVASCRIPT) ---
        class BlockchainSimulator {
            constructor() {
                this.chain = []; // Our "blockchain" is just an array
                this.idCounter = 0;
            }

            storeRandomNumber(bitstring, submitter) {
                this.idCounter++;
                const newBlock = {
                    id: this.idCounter,
                    bitstring: bitstring,
                    submitter: submitter,
                    timestamp: Math.floor(Date.now() / 1000),
                    transactionHash: `0x${[...Array(64)].map(() => Math.floor(Math.random() * 16).toString(16)).join('')}`
                };
                this.chain.push(newBlock);
                return newBlock;
            }

            getNumberDetails(id) {
                const block = this.chain.find(b => b.id === id);
                return block || null;
            }
        }

        // --- APPLICATION LOGIC ---
        document.addEventListener('DOMContentLoaded', () => {
            const qrng = new QuantumSimulator();
            const blockchain = new BlockchainSimulator();
            const account = document.getElementById('account-address').textContent;

            const generateForm = document.getElementById('generate-form');
            const verifyForm = document.getElementById('verify-form');
            const generateButton = document.getElementById('generate-button');
            const generateButtonText = document.getElementById('generate-button-text');
            const generateSpinner = document.getElementById('generate-spinner');
            
            const messageBox = document.getElementById('message-box');
            const genResultBox = document.getElementById('generation-result-box');
            const verResultBox = document.getElementById('verification-result-box');

            const showMessage = (text, type) => {
                messageBox.textContent = text;
                messageBox.className = `message ${type}`;
                messageBox.style.display = 'block';
            };

            const hideResults = () => {
                genResultBox.style.display = 'none';
                verResultBox.style.display = 'none';
                messageBox.style.display = 'none';
            };

            generateForm.addEventListener('submit', (e) => {
                e.preventDefault();
                hideResults();

                generateButton.disabled = true;
                generateButtonText.textContent = 'Generating...';
                generateSpinner.style.display = 'inline-block';

                setTimeout(() => { // Simulate network delay
                    try {
                        const numBits = parseInt(document.getElementById('bits').value, 10);
                        if (isNaN(numBits) || numBits <= 0 || numBits > 64) {
                            throw new Error("Number of bits must be between 1 and 64.");
                        }

                        const bitstring = qrng.generateRandomBitstring(numBits);
                        const newBlock = blockchain.storeRandomNumber(bitstring, account);
                        
                        genResultBox.innerHTML = `
                            <h3>Generation Result</h3>
                            <p><strong>New ID:</strong> <code>${newBlock.id}</code></p>
                            <p><strong>Random Bitstring:</strong> <code>${newBlock.bitstring}</code></p>
                            <p><strong>Transaction Hash:</strong> <code>${newBlock.transactionHash}</code></p>
                        `;
                        genResultBox.style.display = 'block';
                        showMessage('Random number generated and stored successfully!', 'success');

                    } catch (error) {
                        showMessage(error.message, 'error');
                    } finally {
                        generateButton.disabled = false;
                        generateButtonText.textContent = 'Generate & Store';
                        generateSpinner.style.display = 'none';
                    }
                }, 1500); // 1.5 second delay
            });

            verifyForm.addEventListener('submit', (e) => {
                e.preventDefault();
                hideResults();

                try {
                    const idToVerify = parseInt(document.getElementById('verifyId').value, 10);
                    if (isNaN(idToVerify) || idToVerify <= 0) {
                        throw new Error("Please enter a valid ID to verify.");
                    }

                    const block = blockchain.getNumberDetails(idToVerify);
                    if (!block) {
                        throw new Error("Failed to verify ID. It might not exist.");
                    }

                    verResultBox.innerHTML = `
                        <h3>Verification Result</h3>
                        <p><strong>ID:</strong> <code>${block.id}</code></p>
                        <p><strong>Stored Bitstring:</strong> <code>${block.bitstring}</code></p>
                        <p><strong>Submitter Address:</strong> <code>${block.submitter}</code></p>
                        <p><strong>Timestamp:</strong> <code>${new Date(block.timestamp * 1000).toLocaleString()}</code></p>
                    `;
                    verResultBox.style.display = 'block';
                    showMessage(`Successfully retrieved details for ID ${block.id}.`, 'success');

                } catch (error) {
                    showMessage(error.message, 'error');
                }
            });
        });
    </script>
</body>
</html>
